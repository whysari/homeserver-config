# Samba Configuration for Lenovo G50-30 Home Server
# Location: /etc/samba/smb.conf

[global]
   min protocol = SMB2
   ea support = yes
   fruit:metadata = stream
   fruit:model = Macmini
   fruit:veto_appledouble = no
   fruit:posix_rename = yes
   fruit:zero_file_id = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   multicast dns register = yes
   map to guest = bad user

   # IMPORTANT: Keep trailing newline so subsequent share headers are not glued to the include line
   include = /etc/samba/smb.casa.conf

[Media]
   comment = Home Server Media
   path = /DATA/Media
   browseable = yes
   read only = no
   guest ok = yes
   create mask = 0777
   directory mask = 0777
   force user = user
